name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }} · Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            os: ubuntu-latest
            elixir: "1.14"
            otp: "25"
          - platform: Ubuntu
            os: ubuntu-latest
            elixir: "1.17"
            otp: "26"
          - platform: Ubuntu
            os: ubuntu-latest
            elixir: "1.18"
            otp: "27"
          - platform: Ubuntu
            os: ubuntu-latest
            elixir: "1.19"
            otp: "28"
          - platform: Ubuntu
            os: ubuntu-latest
            elixir: "1.20"
            otp: "29"
            quality: true
          - platform: macOS
            os: macos-latest
            elixir: "1.20"
            otp: "29"
          - platform: Windows
            os: windows-latest
            elixir: "1.20"
            otp: "29"
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors

      - if: matrix.quality
        run: mix test --cover --warnings-as-errors

      - if: matrix.quality
        run: mix format --check-formatted

      - if: matrix.quality
        run: mix run scripts/check_conformance_hash.exs
        env:
          MIX_ENV: dev

      - if: matrix.quality
        run: mix credo --strict
        env:
          MIX_ENV: dev

      - if: matrix.quality
        run: mix dialyzer --format github

      - if: matrix.quality
        run: mix docs --warnings-as-errors
        env:
          MIX_ENV: dev

      - if: matrix.quality
        run: mix hex.build
        env:
          MIX_ENV: dev
